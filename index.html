<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGC Dex</title>
<meta name="description" content="VGC Dex — a fast, typed search engine for Pokémon Champions. Coming soon.">
<link rel="canonical" href="https://vgcdex.com/">
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #666; --bg: #fafafa; --accent: #2b6cb0; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #9a9a9a; --bg: #121212; --accent: #7fb3ff; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
  h1 { font-size: 2.4rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>VGC Dex</h1>
  <p>A typed, shareable search engine for Pokémon Champions.</p>
  <p>Coming soon. Try <code>t:steel spe&gt;=100</code> when it's live.</p>
</main>
</body>
</html>
