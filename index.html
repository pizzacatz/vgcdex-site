<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGC Dex</title>
<meta name="description" content="VGC Dex — a typed, shareable search engine for Pokémon Champions.">
<script>/* resolve theme before first paint (GeorgiaPlayEvents convention: <html data-theme>) */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t!=='light'&&t!=='dark')t=null;if(t){try{localStorage.setItem('vgcdex-theme',t)}catch(e){}}if(!t){try{t=localStorage.getItem('vgcdex-theme')}catch(e){}}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ---- GeorgiaPlayEvents brand primitives (docs/COLOR-SCHEME.md §8.3) ---- */
:root{--gpe-gold:#ffd180;--gpe-coral:#ff9e80;--gpe-peach:#ffb072;--gpe-burnt:#a85526;--gpe-burnt-hover:#8f4520;--gpe-black:#0d0d0d;--gpe-surface:#1a1a1a;--gpe-hover:#2a2a2a;--gpe-cream:#fff1df;--gpe-card:#fdf7ef;--gpe-ink:#2c211b;--gpe-paper:#f8efe5}
/* ---- semantic layer: light (default) ---- */
:root{--page:var(--gpe-cream);--card:var(--gpe-card);--card-2:#f7e3cb;--line:#e8d3b8;--text:var(--gpe-ink);--muted:#7a6a58;--accent:var(--gpe-burnt);--accent-hover:var(--gpe-burnt-hover);--accent-contrast:#fff;--accent-soft:#ffe2ca;--focus:rgb(240 160 105/.38);--shadow:0 2px 12px rgb(90 60 30/.14);--err-bg:#fff0ec;--err-line:#d25345;--err-text:#a23a32;--warn-bg:#ffecd8;--warn-line:#d67642;--field:#fffdf8;--field-line:#c6aa90;--bar:#e8d3b8}
:root[data-theme=dark]{--page:var(--gpe-black);--card:var(--gpe-surface);--card-2:#232323;--line:#4a4647;--text:var(--gpe-paper);--muted:#cfc4ba;--accent:var(--gpe-peach);--accent-hover:#ffc08d;--accent-contrast:#241711;--accent-soft:#3f2c22;--focus:rgb(255 176 114/.42);--shadow:0 2px 12px rgb(0 0 0/.55);--err-bg:#3b1d1b;--err-line:#ff6e62;--err-text:#ffaea5;--warn-bg:#3d2a1d;--warn-line:#ffb072;--field:#151516;--field-line:#665b55;--bar:#2f2f33}
*{box-sizing:border-box}html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
html,body{margin:0;background:var(--page);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
h1,h2,h3{font-family:Montserrat,Inter,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:.85em}
.badge{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle;font-family:Inter,sans-serif;letter-spacing:.02em}
/* ---- header (always dark, brand root) ---- */
.top{background:var(--gpe-black);color:#fff;border-bottom:1px solid var(--gpe-surface);position:sticky;top:0;z-index:5}
.top-in{display:flex;align-items:center;gap:16px;height:56px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:Montserrat,sans-serif;font-weight:800;font-size:1.15rem;white-space:nowrap}.brand:hover{text-decoration:none}
.brand .icon svg,.hero-icon svg{display:block}.brand .icon svg{width:30px;height:30px}
.brand .word{background:linear-gradient(45deg,var(--gpe-gold),var(--gpe-coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.topsearch{flex:1;display:flex;max-width:640px}
.topsearch input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:8px 12px;border:1px solid var(--gpe-hover);border-radius:8px 0 0 8px;background:var(--gpe-surface);color:#fff;font-family:ui-monospace,Menlo,monospace}
.topsearch input:focus{outline:2px solid var(--gpe-peach);outline-offset:-1px}
.topsearch button{font:inherit;padding:0 14px;border:1px solid var(--gpe-hover);border-left:0;border-radius:0 8px 8px 0;background:var(--gpe-surface);color:var(--gpe-peach);cursor:pointer;font-size:1.1rem}
.topnav{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:.9rem;font-weight:500}
.topnav a{color:#fff}.topnav a:hover{color:var(--gpe-peach);text-decoration:none}
.topnav .reg{font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--gpe-gold);color:var(--gpe-gold)}
.topnav button{font:inherit;background:transparent;border:1px solid var(--gpe-hover);color:#fff;border-radius:8px;padding:4px 9px;cursor:pointer}.topnav button:hover{border-color:var(--gpe-peach);color:var(--gpe-peach)}
@media (max-width:700px){.top-in{flex-wrap:wrap;height:auto;padding:8px 0}.topsearch{order:3;flex-basis:100%;max-width:none}.brand .word{font-size:1rem}}
/* ---- home ---- */
.hero{background:var(--gpe-black);color:#fff;text-align:center;padding:56px 0 48px;border-bottom:1px solid var(--gpe-surface)}
.hero-icon{width:96px;height:96px;margin:0 auto 12px}.hero-icon svg{width:96px;height:96px}
.hero-title{font-size:2.6rem;font-weight:800;background:linear-gradient(45deg,var(--gpe-gold),var(--gpe-coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{color:#cfc4ba;margin:6px 0 22px;font-size:1.05rem}
.herosearch{display:flex;max-width:720px;margin:0 auto}
.herosearch input{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:14px 16px;border:1px solid var(--gpe-hover);border-radius:10px 0 0 10px;background:var(--gpe-surface);color:#fff;font-family:ui-monospace,Menlo,monospace}
.herosearch input:focus{outline:2px solid var(--gpe-peach);outline-offset:-1px}
.herosearch button{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:0 10px 10px 0;background:var(--gpe-peach);color:#241711;cursor:pointer}.herosearch button:hover{background:#ffc08d}
.hero-links{margin:14px 0 0;color:#cfc4ba;font-size:.9rem}.hero-links a{color:var(--gpe-peach)}
.examples{padding:32px 20px 40px}.examples h2,.group h2,.doc h2{font-size:1.1rem;margin:0 0 12px;font-weight:700}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ex{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);box-shadow:var(--shadow)}.ex:hover{border-color:var(--accent);text-decoration:none}
.ex code{display:block;color:var(--accent);font-weight:600;word-break:break-all}.ex span{font-size:.82rem;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:32px;font-size:.9rem;color:var(--muted)}.how b{color:var(--text)}.how code{color:var(--accent)}
/* ---- results ---- */
.controls{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:4}
.controls-in{display:flex;align-items:center;gap:16px;min-height:46px;flex-wrap:wrap;padding-block:6px}
.count b{font-weight:700}.ctl{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem}.ctl label{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg a{padding:4px 10px;color:var(--text)}.seg a.on{background:var(--accent);color:var(--accent-contrast)}.seg a:hover{text-decoration:none}
select{font:inherit;font-size:.85rem;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}
@media (max-width:700px){.controls{top:auto;position:static}}
.group{padding:22px 20px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}@media (max-width:560px){.grid,.grid.mini{grid-template-columns:repeat(2,1fr);gap:8px}.statrow{font-size:.66rem}.card-body{padding:6px 8px 8px}}.grid.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.grid.items{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--text);box-shadow:var(--shadow);transition:transform .08s}.card:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--accent)}
.card .art{position:relative;aspect-ratio:1;background:var(--card-2);display:grid;place-items:center}.card .art img{width:78%;height:78%;object-fit:contain;image-rendering:pixelated}
.card.item .art{aspect-ratio:auto;height:72px}.card.item .art img{width:40px;height:40px}
.card .mega{position:absolute;top:8px;left:8px;font-size:.65rem;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--gpe-black);color:var(--gpe-gold)}
.card-body{padding:8px 10px 10px}.card-name{font-weight:600;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips.big{margin:8px 0 10px}.chips.big .chip{font-size:.8rem;padding:4px 10px}
.chip{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;text-transform:uppercase;letter-spacing:.04em;line-height:1.5}
.chip.neutral{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;text-transform:none}
.statrow{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;text-align:center}.statrow b{display:block;font-weight:600;color:var(--muted);font-size:.62rem;font-family:Inter,sans-serif}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.list{border-collapse:collapse;width:100%;font-size:.88rem}table.list th,table.list td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}table.list th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--card-2)}
table.list tbody tr:last-child td{border-bottom:0}table.list tr:hover td{background:var(--accent-soft)}
table.list .num{text-align:right;font-family:ui-monospace,Menlo,monospace}table.list .thumb{width:40px;padding:2px 6px}table.list .thumb img{width:36px;height:36px;image-rendering:pixelated;display:block}
.notice{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:20px 0;background:var(--card)}.notice.error{background:var(--err-bg);border-color:var(--err-line);color:var(--err-text)}.notice.zero{background:var(--warn-bg);border-color:var(--warn-line)}
.notice pre{margin:8px 0;padding:8px 10px;background:var(--field);border-radius:6px;overflow-x:auto;color:var(--text)}.notice mark{background:var(--err-line);color:#fff;border-radius:3px;padding:0 2px}.notice ul{margin:6px 0 0;padding-left:20px}.notice p{margin:8px 0 0}
/* ---- detail pages ---- */
.page{padding:20px 20px 40px}.back{margin:0 0 12px;font-size:.9rem}
.page-grid{display:grid;grid-template-columns:300px 1fr;gap:28px}@media (max-width:760px){.page-grid{grid-template-columns:1fr}}
.artbox{background:var(--card-2);border:1px solid var(--line);border-radius:14px;aspect-ratio:1;display:grid;place-items:center;box-shadow:var(--shadow)}.artbox img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated}
.artbox.movebox,.artbox.itembox{aspect-ratio:auto;padding:20px;display:block}.artbox.itembox{text-align:center}.artbox.itembox img{width:96px;height:96px}
.bigstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}.bigstat b{display:block;font-size:1.3rem;color:var(--text);font-family:ui-monospace,Menlo,monospace}
.toolbox{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 14px}.toolbox h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}.toolbox a{display:block;padding:4px 0;font-size:.9rem}
.page-main h1{font-size:2rem;font-weight:800}.page-main h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
ul.plain{list-style:none;padding:0;margin:0}ul.plain li{padding:4px 0}
table.stats{border-collapse:collapse;font-size:.9rem;width:100%;max-width:520px}table.stats th{text-align:left;font-weight:600;padding:3px 8px 3px 0;width:60px}table.stats td{padding:3px 8px}table.stats .num{font-family:ui-monospace,Menlo,monospace;text-align:right;width:48px}
table.stats .bar{width:auto}table.stats .bar i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--gpe-gold),var(--gpe-coral));min-width:2px}table.stats .tot th,table.stats .tot td{border-top:1px solid var(--line);padding-top:6px}
dl.eff{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;margin:0;align-items:center}dl.eff dt{font-weight:600;font-size:.85rem}dl.eff dd{margin:0}dl.eff a:hover{text-decoration:none}dl.eff sup{font-size:.6rem;color:var(--muted);margin-left:1px}
.movechips{display:flex;flex-wrap:wrap;gap:6px}.mc{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;color:#fff;border:1px solid rgb(0 0 0/.15)}.mc:hover{text-decoration:none;filter:brightness(1.12)}
.doc p{max-width:760px}.doc h2{margin-top:26px}table.guide{border-collapse:collapse;width:100%;max-width:820px;font-size:.9rem}table.guide td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}table.guide td:first-child{white-space:nowrap;color:var(--accent);font-weight:600}

/* ---- advanced search form (home) — Scryfall /advanced measurements on our tokens ---- */
.adv{padding:6px 20px 30px}
.form-layout{padding:5px 0 15px}
.form-row{display:flex;flex-flow:row wrap;justify-content:flex-start;padding:12px 0 14px;border-bottom:1px solid var(--line);max-width:100%}
.form-row-label{width:18%;min-width:180px;height:48px;display:flex;align-items:center;font-size:16px;font-weight:300;line-height:20px;padding:0 8px 0 0;margin:0;color:var(--text)}
.form-row-label.short{height:36px}.form-row-label svg{width:18px;height:18px;margin:0 7px 0 0;flex:none;color:var(--muted)}
.form-row-content{width:80%;max-width:100%;display:flex;flex-flow:column nowrap;align-items:flex-start}
.band{max-width:100%;width:100%;display:flex;flex-flow:row wrap;align-items:center;padding:5px 0}
.form-row-tip{width:100%;margin:2px 0 0;font-size:12px;color:var(--muted);font-style:italic;max-width:620px;line-height:1.5}
.form-input{font:inherit;background:var(--field);border-radius:2px;border:1px solid var(--field-line);color:var(--text);font-size:16px;height:38px;line-height:20px;padding:8px 10px;transition:background-color 60ms linear,border-color 60ms linear,box-shadow 60ms linear;width:50%;min-width:240px;max-width:420px}
.form-input:focus{outline:none;box-shadow:0 0 3px var(--field-line);border-color:var(--accent)}
select.form-input{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-size:14px;background-position:right 8px center}
.form-input.auto{width:auto;min-width:0}
.form-input.small-select,.band .small-select{max-width:32%;margin-right:1%}.dup select[data-f=stat]{max-width:26%}.dup select[data-f=op]{max-width:38%}
.form-input.medium-select{max-width:40%;margin-right:1%}
.band .form-input.auto+.form-input.auto{margin-left:0}
.band>select.form-input.auto{margin-right:1%}
.dup{padding:3px 0}
.asc{height:26px;font-size:15px;display:flex;flex-flow:row nowrap;align-items:center;margin:0 16px 5px 0;cursor:pointer;white-space:nowrap}
.asc input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;background:var(--field);border-radius:2px;border:1px solid var(--field-line);color:var(--accent);font-size:20px;display:flex;justify-content:center;align-items:center;margin:0 8px 0 0;cursor:pointer;transition:box-shadow 60ms linear}
.asc input[type=checkbox]:hover,.asc input[type=checkbox]:focus{box-shadow:0 0 4px var(--field-line);outline:none}.asc input[type=checkbox]:checked::before{content:"✓";font-weight:700;line-height:1}
.tokens{display:flex;flex-flow:row wrap;align-items:center;gap:4px 6px;width:50%;min-width:240px;max-width:420px;min-height:38px;padding:4px 6px;background:var(--field);border:1px solid var(--field-line);border-radius:2px;cursor:text}
.tokens:focus-within{box-shadow:0 0 3px var(--field-line);border-color:var(--accent)}
.tok{display:inline-flex;align-items:center;height:22px;font-size:14px;line-height:1;color:var(--text)}
.pol{font:inherit;font-size:10px;font-weight:700;letter-spacing:.04em;height:18px;width:30px;border:0;border-radius:2px;cursor:pointer;margin-right:6px;background:var(--accent-soft);color:var(--accent)}.pol.not{background:var(--err-bg);color:var(--err-text)}
.tok-l{padding-right:2px}.tok-x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}.tok-x:hover{color:var(--err-text)}
.tok-in{flex:1;min-width:140px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--text);height:26px;padding:0 4px}.tok-in:focus{outline:none}
.submit-row{border-bottom:0;padding-top:16px}
.submit-n{font:inherit;font-size:15px;font-weight:600;height:38px;padding:0 14px;border-radius:2px;border:1px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer;margin-right:10px}.submit-n:hover{background:var(--accent);color:var(--accent-contrast)}.submit-n:disabled{opacity:.45;cursor:default;background:var(--card);color:var(--accent)}
.reset-n{font:inherit;font-size:15px;height:38px;padding:0 12px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;margin-right:14px}
.qpreview{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:13px;color:var(--accent);padding:4px 0}
.also code{color:var(--accent)}.editadv{font-size:.85rem;margin-left:8px}
@media (max-width:700px){.form-row-label{width:100%;min-width:0;height:auto;padding:0 0 6px}.form-row-label.short{height:auto}.form-row-content{width:100%}.form-input,.tokens{width:100%;max-width:none;min-width:0}.form-input.small-select,.band .small-select,.form-input.medium-select{max-width:100%;margin:0 0 6px}.asc{margin-bottom:8px}}
/* ---- footer ---- */
.foot{background:var(--gpe-black);color:#cfc4ba;font-size:.8rem;padding:28px 0;margin-top:30px;border-top:1px solid var(--gpe-surface)}.foot b{color:#fff}.foot code{color:var(--gpe-gold)}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}.foot .proto{display:inline-block;margin-top:6px;font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--gpe-gold);color:var(--gpe-gold);letter-spacing:.06em;text-transform:uppercase}
/* ---- Pokémon type colours (data surface, kept conventional) ---- */
.type-normal,.mc.type-normal{background:#8f8a6a}.type-fire,.mc.type-fire{background:#d95a1a}.type-water,.mc.type-water{background:#3372c9}.type-electric,.mc.type-electric{background:#c9a400;color:#1b1b1b}.type-grass,.mc.type-grass{background:#4e9a3a}.type-ice,.mc.type-ice{background:#3aa7ab}.type-fighting,.mc.type-fighting{background:#b0302c}.type-poison,.mc.type-poison{background:#87418f}.type-ground,.mc.type-ground{background:#b58f3c;color:#1b1b1b}.type-flying,.mc.type-flying{background:#7d72c9}.type-psychic,.mc.type-psychic{background:#d94a7e}.type-bug,.mc.type-bug{background:#7e9420}.type-rock,.mc.type-rock{background:#9a8449}.type-ghost,.mc.type-ghost{background:#5b4c8c}.type-dragon,.mc.type-dragon{background:#563bc2}.type-dark,.mc.type-dark{background:#4e3f34}.type-steel,.mc.type-steel{background:#7f7f99}.type-fairy,.mc.type-fairy{background:#d67ec0;color:#1b1b1b}
.cat-physical{background:#b03a2e}.cat-special{background:#5560b3}.cat-status{background:#6f7a7a}
</style>
</head>
<body>
<div id="app"><header class="top"><div class="wrap top-in"><span class="brand"><span class="word">VGC Dex</span></span></div></header><main class="wrap"><p class="muted" style="padding:24px 0">Loading data…</p></main></div>
<script src="app.js"></script>
</body>
</html>
